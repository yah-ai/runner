[workspace]
members = [
    "crates/core",
    "crates/ho",
    "crates/ha",
    "crates/mcp",
    "crates/pv",
    "crates/stub",
]
resolver = "2"
package = { version = "0.8.43" }

# --- profiles: keep in lockstep with the yah monorepo root Cargo.toml ---
# (sccache keys include rustc flags; see oss/srcgraph/Cargo.toml for the why.)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
incremental = false
