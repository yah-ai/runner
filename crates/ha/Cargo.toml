[package]
name = "yah-runner-ha"
version = "0.8.43"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/runner"
description = "Anthropic-native (/v1/messages SSE) cell of the yah agent runner"
readme = "../../README.md"
keywords = ["agent", "llm", "runtime"]
categories = ["development-tools"]

[dependencies]
yah-runner-core = { version = "0.8.43", path = "../core", default-features = false }

async-trait = "0.1"
futures = "0.3"
# Only for `StatusCode`'s canonical reason phrase in error messages (the
# same type reqwest re-exports, so the text is unchanged from the reqwest era).
http = "1"
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

# R950-F7: HTTP goes through yah-runner-core's `HttpClient`; the reqwest
# substrate is the default feature, so a wasm / iOS host builds with
# `--no-default-features` and hands the runner its own client.
[features]
default = ["reqwest"]
reqwest = ["yah-runner-core/reqwest"]

[dev-dependencies]
yah-runner-stub = { path = "../stub" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
bytes = "1"
