[package]
name = "yah-runner-ho"
version = "0.8.43"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/runner"
description = "OpenAI-compatible (Chat Completions SSE + Ollama /api/chat) cell of the yah agent runner"
readme = "../../README.md"
keywords = ["agent", "llm", "runtime"]
categories = ["development-tools"]

# R950-F5: HTTP goes through yah-runner-core's `HttpClient`; the reqwest
# substrate is the default feature, so a wasm / iOS host builds with
# `--no-default-features` and hands the runner its own client.
[features]
default = ["reqwest"]
reqwest = ["yah-runner-core/reqwest"]

[dependencies]
yah-runner-core = { version = "0.8.43", path = "../core", default-features = false }

async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
yah-runner-stub = { path = "../stub" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
